<!DOCTYPE html><html lang="fa" dir="rtl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Forge">
<title>Forge Builder v3</title>
<style>
:root{--bg:#0b0d12;--sf:#121722;--ln:#222b3d;--tx:#e6eaf2;--mu:#8792a8;--ac:#8ea2ff;--er:#ff7b86;--wr:#f0c15a}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.7 Vazirmatn,Tahoma,system-ui,sans-serif;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom))}
main{max-width:980px;margin:0 auto;display:grid;gap:12px}
h1{font-size:22px;margin:4px 0 0}
p{margin:0;color:var(--mu)}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
button,select{font:inherit;color:var(--tx);background:#1a2132;border:1px solid var(--ln);border-radius:8px;padding:7px 12px;min-height:40px}
button.p{background:var(--ac);color:#0b0d12;border-color:var(--ac);font-weight:700}
button:focus-visible,select:focus-visible,textarea:focus-visible,#drop:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#drop{border:1.5px dashed var(--ln);text-align:center;padding:22px 12px;cursor:pointer}
#drop.on{border-color:var(--ac);background:#161d30}
textarea{width:100%;height:220px;direction:ltr;background:#0d111a;color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:10px;font:13px/1.5 ui-monospace,Menlo,monospace;resize:vertical}
iframe{width:100%;height:58vh;min-height:320px;border:1px solid var(--ln);border-radius:8px;background:#fff}
#con{height:58vh;min-height:320px;overflow:auto;direction:ltr;text-align:left;background:#0d111a;border:1px solid var(--ln);border-radius:8px;padding:8px;font:12.5px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap}
.error{color:var(--er)}.warn{color:var(--wr)}.info{color:var(--ac)}
#st{color:var(--mu)}
.b{padding:2px 10px;border:1px solid var(--ln);border-radius:99px;font-size:13px;color:var(--ac)}
.hide{display:none}
</style>
<style data-anyhtml="">html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}</style></head>
<body>
<main>
  <div>
    <h1>Forge Builder</h1>
    <p>پروژه Node، Vite + React یا Python بدهید؛ داخل مرورگر ساخته و اجرا می‌شود.</p>
  </div>
  <section class="card" id="drop" tabindex="0"><b>انتخاب ZIP یا فایل‌ها</b> یا رها کردن اینجا<p>node_modules و dist نادیده گرفته می‌شوند</p></section>
  <input id="in" type="file" multiple="" hidden="">
  <div class="row"><span>نمونه:</span><button data-s="react">React</button><button data-s="flask">Flask</button><button data-s="node">Node</button></div>
  <section class="card">
    <div class="row"><select id="sel" aria-label="فایل"></select><button id="add">فایل جدید</button><button id="del">حذف</button><span class="b" id="kd">—</span></div>
    <textarea id="ed" spellcheck="false" aria-label="ویرایشگر"></textarea>
  </section>
  <section class="card">
    <div class="row"><button class="p" id="run">ساخت و اجرا</button><button data-t="v">پیش‌نمایش</button><button data-t="c">کنسول</button><button id="dl">دانلود HTML</button><button id="op">باز کردن در تب</button><span id="st"></span></div>
    <iframe id="fr" sandbox="allow-scripts allow-modals allow-forms allow-popups" title="پیش‌نمایش"></iframe>
    <div id="con" class="hide" role="log"></div>
  </section>
</main>

  put(BR+'<script>'+proc+'<\/script><script type="importmap">'+JSON.stringify({imports:r.map})+'<\/script><script type="module">'+r.js.replace(/<\/script/gi,'<\\/script')+'<\/script>');
  tab('c');
}

/* ---------- موتور Python (Pyodide) + سرور مجازی Flask ---------- */
const MPL="try:\n    import matplotlib;matplotlib.use('agg')\n    import matplotlib.pyplot as plt,io,base64,js\n    def _show(*a,**k):\n        for n in plt.get_fignums():\n            b=io.BytesIO();plt.figure(n).savefig(b,format='png');js.__img(base64.b64encode(b.getvalue()).decode())\n        plt.close('all')\n    plt.show=_show\nexcept Exception:\n    pass\n";
async function runPy(){
  if(!py){
    log('بارگذاری Pyodide (بار اول چند ثانیه طول می‌کشد)…','info');
    await load('https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js');
    py=await loadPyodide({stdout:m=>{out+=m+'\n';log(m)},stderr:m=>{out+=m+'\n';log(m,'error')}});
  }
  out='';imgs=[];window.__img=b=>imgs.push(b);
  try{py.FS.mkdirTree('/p')}catch{}
  let all='';
  for(const[k,v]of F){
    if(isBin(k,v))continue;
    const d=dir(k);if(d)py.FS.mkdirTree('/p/'+d);
    py.FS.writeFile('/p/'+k,v);
    if(k.endsWith('.py'))all+=v+'\n';
  }
  const en=['main.py','app.py','run.py','server.py'].find(k=>F.has(k))||[...F.keys()].find(k=>k.endsWith('.py'));
  if(!en)throw Error('فایل .py پیدا نشد');
  const fl=/^\s*(from|import)\s+flask/im.test(all);
  const rq=(F.get('requirements.txt')||'').split('\n').map(s=>s.trim()).filter(s=>s&&!s.startsWith('#'));
  if(fl&&!rq.some(r=>/^flask/i.test(r)))rq.push('flask');
  await py.loadPackagesFromImports(all);
  if(rq.length){await py.loadPackage('micropip');log('نصب پکیج‌ها: '+rq.join(', '),'info');await py.pyimport('micropip').install(py.toPy(rq))}
  py.globals.set('ENTRY',en);
  const pre="import os,sys,runpy,json\nos.chdir('/p')\nsys.path.insert(0,'/p')\n";
  if(fl){
    await py.runPythonAsync(pre+"ns=runpy.run_path(ENTRY,run_name='forge')\napp=next((v for v in ns.values() if v.__class__.__name__=='Flask'),None)\nif app is None: raise RuntimeError('نمونه Flask پیدا نشد')\ndef forge(m,u,d):\n    r=app.test_client().open(u,method=m,data=d,follow_redirects=True)\n    return json.dumps([r.status_code,r.get_data(as_text=True)])\n");
    cu='/';await go('GET','/');
  }else{
    await py.runPythonAsync(pre+MPL+"runpy.run_path(ENTRY,run_name='__main__')\n");
    put(BR+'<body style="margin:0;background:#0d111a;color:#e6eaf2;font:14px/1.6 ui-monospace,monospace;padding:12px"><pre style="white-space:pre-wrap;margin:0">'+esc(out||'(بدون خروجی)')+'</pre>'+imgs.map(b=>'<img style="max-width:100%;background:#fff;margin-top:10px" src="data:image/png;base64,'+b+'">').join(''));
  }
}
async function go(m,u,d){
  if(!u)u=cu;
  if(m==='GET'&&d){u+=(u.includes('?')?'&':'?')+new URLSearchParams(d);d=null}
  if(!u.startsWith('/'))u=cu.replace(/[^/]*$/,'')+u;
  cu=u;
  const[s,h]=JSON.parse(py.globals.get('forge')(m,u,d?py.toPy(d):null));
  log(m+' '+u+'  '+s,s>=400?'error':'info');
  put(inj(inj(h,BR),NAV,1));
}

/* ---------- اجرا و خروجی ---------- */
async function run(){
  $('#con').innerHTML='';tab('v');st('در حال ساخت…');kind=detect();
  try{
    const fn={web:runWeb,node:runNode,python:runPy}[kind];
    if(!fn)throw Error('نوع پروژه شناخته نشد؛ index.html، package.json یا فایل .py لازم است');
    await fn();st('اجرا شد');
  }catch(e){
    log(e.errors?e.errors.map(x=>x.text).join('\n'):(e.message||String(e)),'error');
    tab('c');st('خطا');
  }
}
$('#run').onclick=run;
